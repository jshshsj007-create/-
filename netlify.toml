# إعدادات النشر جاهزة، فما يحتاج المستخدم يكتب شيئًا في واجهة Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# مخزن البيانات المشترك — لازم قبل قاعدة الصفحة الواحدة تحت
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/state"
  status = 200
  force = true

# التطبيق صفحة واحدة: أي مسار يرجع لنفس الصفحة
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# الصفحة نفسها ما تُخزَّن: هي اللي تدل على ملفات النسخة الجديدة،
# فلو انحفظت بقي المتصفح على نسخة قديمة وما شاف أي تحديث.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# الجذر يُخدَم بنفس الصفحة، والقاعدة فوق ما تنطبق عليه لأنها تطابق المسار حرفيًا
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"
