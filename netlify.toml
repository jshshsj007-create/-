# إعدادات النشر جاهزة، فما يحتاج المستخدم يكتب شيئًا في واجهة Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# التطبيق صفحة واحدة: أي مسار يرجع لنفس الصفحة
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
